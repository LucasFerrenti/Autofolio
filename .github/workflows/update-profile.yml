name: Update Portfolio Data

on:
  workflow_dispatch:
  schedule:
    # Run on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Fetch profile & repositories data
        env:
          LINKEDIN_USERNAME: ferrenti-lucas
          GITHUB_USERNAME: LucasFerrenti
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/fetch-data.ts

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A src/data/
          if ! git diff --cached --quiet; then
            echo "Cambios detectados. Commiteando y subiendo cambios..."
            git commit -m "chore: update portfolio profile and repositories data [automated]"
            git push
          else
            echo "No se detectaron cambios en src/data/."
          fi

